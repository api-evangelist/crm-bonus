api: Oto Data API
summary: >-
  Oto publishes a real, separately-hosted staging (homologação) environment for
  the Data API, declared in the spec's own servers[] block. It is a
  credentialed-parity sandbox, not an open playground: the same code paths and
  the same schema validation run, but writes do not affect stored data, and a
  separate credential is required.
test_vs_live:
  separation: separate-host
  environments:
  - name: Production
    url: https://data-api.otocrm.com.br
    declared_in: openapi servers[]
    writes_persist: true
  - name: Test (homologação)
    url: https://data-api-hmg.otocrm.com.br
    declared_in: openapi servers[]
    writes_persist: false
    reachable: true
    note: >-
      Serves the identical OpenAPI document as production (byte-for-byte
      identical openapi.json, verified 2026-08-12).
  - name: localhost
    url: http://localhost:8000
    declared_in: openapi servers[]
    note: >-
      A development entry left in the published servers[] block. Not a usable
      environment for an integrator; recorded because it is in the contract.
  key_prefixes: null
  key_note: >-
    Credentials are opaque bearer tokens with no documented test/live prefix.
    "Ambos os ambientes requerem credenciais específicas" — each environment
    requires its own credential, issued by Oto/CRMBonus support on request.
  quote: >-
    "existem dois ambientes distintos: produção e homologação... no ambiente de
    homologação os dados não são modificados."
interactive_console:
