api: Oto Data API
limit_count: 2
limits:
- id: requests-per-minute
  scope: per-source-ip
  applies_to: all endpoints
  window: 1m
  limit: 200
  burst: null
  overflow_behaviour: >-
    Requests over the limit are first DELAYED (throttled) to hold the caller to
    the stated pace; sustained excess is eventually rejected.
  status_on_exhaustion: 429
  status_text: Too many requests
  quote: >-
    "esta API aceita um número máximo de 200 requisições por minuto por IP de
    origem. As requisições que excederem este limite terão suas respostas
    atrasadas para que se mantenha o ritmo estipulado, até que eventualmente
    podem ser barradas com a resposta HTTP/1.1 429 Too many requests."
- id: records-per-request
  scope: per-request
  applies_to: all endpoints (the `data` array of every POST body)
  window: null
  limit: 10000
  unit: records
  status_on_exhaustion: 413
  status_text: Payload Too Large
  quote: >-
    "São aceitos até 10.000 registros por requisição. Caso a propriedade `data`
    contenha um número superior de entradas, a requisição será recusada com a
    resposta HTTP/1.1 413 Payload Too Large."
