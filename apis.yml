apis:
- name: Oto Data API
  description: >-
    REST data-ingestion API for the Oto CRM platform (a CRMBonus retail solution).
    Thirteen POST operations load customers, orders, order items, products, stores,
    sellers, cashback credits, NPS responses, exclusion lists, and Oto Tags web
    events. Records are written upsert-style — a record whose primary key already
    exists is replaced in full — so a retried load converges on the same state.
    Authentication is an HTTP bearer token issued by Oto/CRMBonus support; a
    /auth/login operation exchanges username and password for a 3600-second JWT.
    Limits are published in the spec description: 200 requests per minute per source
    IP (HTTP 429) and 10,000 records per request (HTTP 413). Production and a staging
    (homologação) environment are both declared in servers[].
  humanURL: https://data-api.otocrm.com.br/redoc
  baseURL: https://data-api.otocrm.com.br
