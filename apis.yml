name: CRM Bonus
description: >-
  CRM Bonus (CRMBonus) is a Brazilian retail technology platform for customer
  acquisition, conversion, and loyalty. Its products include Giftback cashback and
  rewards, the Vale Bonus consumer rewards app connecting brands to over five million
  shoppers, CRMBack WhatsApp-based e-commerce conversion, CRMAds retail media on
  WhatsApp, and Oto CRM — the physical-retail CRM platform CRMBonus acquired outright
  from WPP in June 2025 and now lists as a first-party retail solution. It integrates
  with 300+ ERP, point-of-sale, and e-commerce systems including VTEX, Shopify, Linx,
  TOTVS, Nuvemshop, Wake, and PagSeguro. The publicly documented machine-readable
  contract is the Oto Data API — an OpenAPI 3.1.0 upsert-ingestion API for customers,
  orders, order items, products, stores, sellers, cashback, NPS, and Oto Tags events —
  served at data-api.otocrm.com.br with a public ReDoc/Swagger reference. The Giftback
  and Vale Bonus APIs on api.crmbonus.com are partner-token gated with no public
  reference; that host answers HTTP 200 with an "OK!!" envelope for every path,
  including every /.well-known/* probe, so none of those 200s carry a real document.
