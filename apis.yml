name: CRM Bonus
description: >-
  CRM Bonus (CRMBonus) is a Brazilian retail technology platform for customer
  acquisition, conversion, and loyalty. Its products include Giftback cashback and
  rewards, the Vale Bonus consumer rewards app connecting brands to over five million
  shoppers, CRMBack WhatsApp-based e-commerce conversion, and CRMAds retail media on
  WhatsApp. It integrates with 300+ ERP, point-of-sale, and e-commerce systems
  including VTEX, Shopify, Linx, TOTVS, Nuvemshop, and PagSeguro. Integration is
  delivered through partner connectors rather than a public developer API; no public
  API documentation, developer portal, OpenAPI, or /.well-known discovery surface was
  found during enrichment.
