x-enrichment:
  date: '2026-08-12'
  status: enriched
  artifacts_added: 16
  pass: local-v1
  note: >-
    Round 2 overturned round 1's "no public developer API" finding. STEP 0b
    contract discovery on the acquired Oto CRM brand located a live, first-party
    OpenAPI 3.1.0 (13 operations, 34 schemas) at data-api.otocrm.com.br, plus an
    Atlassian status page at status.otocrm.com.br with dedicated "API Pública"
    and "API Privada" components. Ownership verified per STEP 0c: CRMBonus
    acquired 100% of Oto CRM from WPP in June 2025, lists Oto CRM in its own
    site navigation under Soluções | Varejo linking to otocrm.com.br, and the
    Oto help center is titled "Oto CRM | Powered by CRMBonus". No WellKnown,
    SecurityTxt, AgentCard, Compliance, Security, ChangeLog, Pricing, SignUp or
    DeveloperPortal pointer is wired — each was probed and genuinely absent. The
    nine HTTP 200s on api.crmbonus.com/.well-known/* are a soft-200 catch-all
    and were rejected, not credited.
