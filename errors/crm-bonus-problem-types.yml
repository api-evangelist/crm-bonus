  source: documented in the operation description's "Códigos de status"
- status: 403
  title: Conta de usuário inativa
  remediation: The user account exists but is inactive; contact Oto/CRMBonus support.
  declared: true
  source_operation: login_auth_login_post
  source: documented in the operation description's "Códigos de status"
- status: 500
  title: Erro interno no servidor por exceção não esperada
  remediation: Retry; if persistent, check https://status.otocrm.com.br and contact support.
  declared: true
  source_operation: login_auth_login_post
  source: documented in the operation description's "Códigos de status"
