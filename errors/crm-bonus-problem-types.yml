format: fastapi-detail
rfc9457: false
envelope:
  content_type: application/json
  shape: '{"detail": <string | array>}'
  note: >-
    NOT RFC 9457 Problem Details. There is no application/problem+json media
    type, no `type` URI, no `title` and no per-error code registry — the error
    identity is carried by the HTTP status plus a free-text (or structured
    validation) `detail`. Recorded as-is; no problem types were invented to fill
    the shape.
problems:
- status: 403
  detail: Not authenticated
  title: Missing or malformed bearer token
  remediation: >-
    Send the token issued by Oto/CRMBonus support in the Authorization header as
    "Bearer <token>", or call POST /auth/login to obtain a JWT.
  observed: true
  source_operation: all /v1/* operations (HTTPBearer security requirement)
  evidence: live POST https://data-api.otocrm.com.br/v1/customers with no credentials -> 403 {"detail":"Not authenticated"}
- status: 404
  detail: Not Found
  title: Unknown path
  remediation: Check the path against the published spec; the API root itself returns 404.
  observed: true
  source_operation: routing
  evidence: live GET https://data-api.otocrm.com.br/v1/nope -> 404 {"detail":"Not Found"}
- status: 422
  title: Validation Error
  schema: HTTPValidationError
  detail_shape: '[{"loc": ["body", 0, "customer_id"], "msg": "...", "type": "..."}]'
  remediation: >-
    Each entry locates the offending field via `loc` (body -> record index ->
    field). The docs call this out as a deliberate feature — validation at
    ingest lets an integrator find bad source data in staging before promoting to
    production.
  declared: true
  source_operation: >-
    every operation — /auth/login, /v1/blocked, /v1/cashback, /v1/customers,
    /v1/nps, /v1/orders, /v1/order_items, /v1/products, /v1/sellers, /v1/stores,
    /v1/tag_hits, /v1/tag_interactions, /v1/tag_ids
- status: 429
  title: Too many requests
  remediation: >-
    Hold to 200 requests per minute per source IP. Responses are throttled
    (delayed) before rejection, so a client that respects backpressure normally
    never sees this. No Retry-After header is returned.
  declared: true
  source_operation: all operations
  source: info.description "# Limites" -> "Limite de requisições"
- status: 413
  title: Payload Too Large
  remediation: >-
    Split the `data` array into batches of at most 10,000 records.
  declared: true
  source_operation: all ingestion operations
  source: info.description "# Limites" -> "Limite de registros por requisição"
- status: 401
