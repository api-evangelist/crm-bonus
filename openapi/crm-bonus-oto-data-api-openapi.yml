  /auth/login:
    post:
      summary: Login
      description: "Autentica um usuário e retorna um token JWT de acesso.\n\nEste endpoint valida o nome\
        \ de usuário e a senha informados na collection\n`users` do MongoDB. Caso as credenciais sejam\
        \ válidas e o usuário esteja ativo,\num token JWT é gerado contendo informações do usuário e suas\
        \ permissões, com\ntempo de expiração padrão de 60 minutos (3600 segundos).\n\nRegistro de logs:\n\
        \    - Registra um log de ERRO se o banco de dados não estiver inicializado.\n    - Registra um\
        \ log de AVISO (WARNING) se as credenciais forem inválidas ou o usuário estiver inativo.\n   \
        \ - Registra um log de INFO em caso de login bem-sucedido.\n    - Registra um log de ERRO para\
        \ exceções inesperadas.\n\nArgumentos:\n    data (LoginRequest): Objeto contendo os campos `username`\
        \ e `password`.\n\nRetorno:\n    TokenResponse: Objeto contendo o `access_token` JWT e o tempo\
        \ de expiração em segundos.\n\nCódigos de status:\n    200: Autenticação realizada com sucesso.\n\
        \    401: Credenciais inválidas.\n    403: Conta de usuário inativa.\n    500: Erro interno no\
        \ servidor por exceção não esperada.\n\nExemplo de requisição:\n    Corpo da requisição:\n   \
        \ {\n        \"username\": \"joao_silva\",\n        \"password\": \"senhaSegura123\"\n    }\n\n\
        Exemplo de resposta (200):\n    {\n        \"access_token\": \"<jwt_token_aqui>\",\n        \"\
        expires_in\": 3600\n    }"
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Cashback:
      properties:
        customer_id:
          type: string
          title: Customer Id
          description: Identificador único do cliente
        order_date:
          type: string
          format: date
          title: Order Date
          description: Data da compra (yyyy-mm-dd)
        order_id:
          type: string
          title: Order Id
          description: Código do pedido
        order_store:
          type: string
          title: Order Store
          description: Código da loja da compra
        seller_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Seller Id
          description: Código (matrícula) do vendedor da compra
        credit:
          type: number
          title: Credit
          description: Valor total acumulado
        canceled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Canceled
          description: Desconsidera o registro (crédito) se verdadeiro
        valid_until:
          type: string
          format: date-time
          title: Valid Until
          description: "Data e hora de validade (yyyy-mm-dd HH:MM:SS).\n    \nImediatamente após a data\
            \ e horário especificados o crédito será considerado expirado."
      type: object
      required:
      - customer_id
      - order_date
      - order_id
      - order_store
      - credit
      - valid_until
      title: Cashback
    CashbackPostRequest:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Cashback'
          type: array
          title: Data
      type: object
      required:
      - data
      title: CashbackPostRequest
    Customer:
      properties:
        customer_id:
          type: string
          title: Customer Id
          description: Identificador único do cliente
        document_number:
          anyOf:
          - type: string
