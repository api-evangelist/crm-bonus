          - type: 'null'
          title: Mkt Cloud Id
          description: Identificador do usuário na marketing cloud
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
          description: E-mail do cliente
        email_permission:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Email Permission
          description: Permissão para envio de e-mails promocionais
        mobile_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Mobile Number
          description: "Telefone celular do cliente, com DDD, DDI e nono dígito.\n\nO WhatsApp só aceita\
            \ números formatados corretamente, ou seja, para\ntelefones do Brasil, o formato é de formato\
            \ de 13 dígitos, sendo 2\ndígitos do DDI + 2 dígitos DDD + o dígito 9 + 8 dígitos do telefone.\n\
