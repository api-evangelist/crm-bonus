            \ produto; C = Produto adicionado ao\n        carrinho; K = Checkout; P = Produtos comprados;\n\
            \        T = Transação de compra"
        id:
          type: string
          title: Id
          description: "Agrupador do produto (detalhe, carrinho e\n        checkout), código do pedido\
            \ (transação) ou categoria (navegação)"
        sku:
