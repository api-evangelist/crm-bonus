summary: >-
  CRM Bonus publishes no server-side client SDK for its APIs in any language.
  The one clearly first-party published package is a browser web-component
  library for the CRMChat surface, published to npm under the @crm-bonus scope
  by the company's own npm accounts. The Oto Data API (the provider's only
  public OpenAPI) has NO published client library in any registry — integrators
  call it over plain REST.
